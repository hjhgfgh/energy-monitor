# docker profile：容器网络内用服务名替代 127.0.0.1
spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
  datasource:
    url: jdbc:mysql://mysql:3306/energy_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  kafka:
    bootstrap-servers: kafka:9092
  data:
    redis:
      host: redis

server:
  port: 8081

spring:
  application:
    name: em-device-access

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        linger.ms: 10
        batch.size: 16384

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

energy:
  netty:
    port: 9000
    boss-threads: 1
    worker-threads: 0
    max-frame-length: 1024
    reader-idle-timeout-seconds: 90
    backlog: 128

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.energy: INFO
    io.netty: WARN

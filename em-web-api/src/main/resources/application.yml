server:
  port: 8083

spring:
  application:
    name: em-web-api

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/energy_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # 大屏「最新数据」读 device:latest 缓存，这份缓存由 em-data-process 消费时写入
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  type-aliases-package: com.energy.common.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

# Feign 调用 em-device-access：这里只需要写服务名，具体实例由 Nacos 解析
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

energy:
  jwt:
    # 必须与 em-gateway 的 energy.jwt.secret 完全一致，
    # 否则会出现「登录成功但后续请求全部 401」
    secret: energyMonitorJwtSecretKeyForHmacSha256Algorithm2026
    expire-minutes: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.energy: INFO

server:
  port: 8080

spring:
  application:
    name: em-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/energy_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地开发默认密码；生产环境请通过环境变量 MYSQL_PASSWORD 注入，不要把密码提交进仓库
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

energy:
  netty:
    port: 9000
    boss-threads: 1
    worker-threads: 0
    max-frame-length: 1024
    reader-idle-timeout-seconds: 90
    backlog: 128
  processor:
    mode: db

mybatis-plus:
  type-aliases-package: com.energy.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.energy: INFO
    io.netty: WARN

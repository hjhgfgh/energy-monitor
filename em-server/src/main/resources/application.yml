server:
  port: 8080

spring:
  application:
    name: em-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/energy_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地开发默认密码；生产环境请通过环境变量 MYSQL_PASSWORD 注入，不要把密码提交进仓库
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # 幂等生产者：配合 acks=all 保证 broker 端不产生重复消息
        enable.idempotence: true
        # 攒批发送，用 10ms 延迟换吞吐；单批上限 16KB
        linger.ms: 10
        batch.size: 16384
    consumer:
      auto-offset-reset: earliest
      # 手动提交：处理成功才提交 offset，避免失败时数据被跳过
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.energy.server.dto
        spring.json.value.default.type: com.energy.server.dto.DeviceDataEvent
    listener:
      # 批量监听 + 手动立即提交
      type: batch
      ack-mode: manual_immediate

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

energy:
  netty:
    port: 9000
    boss-threads: 1
    worker-threads: 0
    max-frame-length: 1024
    reader-idle-timeout-seconds: 90
    backlog: 128
  processor:
    # log   : 仅计数打印，不依赖任何外部组件（验证 TCP 链路用）
    # db    : 直连入库，无 Kafka 的对照实现（用于演示「为什么需要消息队列」）
    # kafka : 投递 Kafka 由消费者落库（P2 默认）
    mode: kafka
  consumer:
    # 关掉它可只保留生产端，用于单独演示 Kafka 积压
    enabled: true

mybatis-plus:
  type-aliases-package: com.energy.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.energy: INFO
    io.netty: WARN
